[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-netmon"
version = "0.1.0"
description = "Tray network monitor: link, whitelist mode, speed (bypasses Throne TUN)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "pystray>=0.19",
  "Pillow>=10.0",
]

[project.scripts]
argus-netmon = "argus_netmon.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
argus_netmon = ["py.typed"]
